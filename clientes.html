<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitud de Servicio de Limpieza | LIMPIAPP by Shineconnect</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    :root {
      --primary: #4f585d;
      --primary-hover: #3d4549;
      --accent: #7faecb;
      --accent-hover: #689cb9;
      --bg-color: #f7fafc;
      --card-bg: #ffffff;
      --text-main: #2d3748;
      --text-muted: #718096;
      --border-color: #e2e8f0;
      --focus-ring: rgba(127, 174, 203, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 6px;
      text-decoration: none;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--primary);
    }

    .brand-sub {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
    }

    .lang-switcher select {
      padding: 6px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: #fff;
      font-size: 13px;
      color: var(--text-main);
      cursor: pointer;
      outline: none;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 16px;
    }

    .form-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 580px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      padding: 32px 28px;
    }

    .form-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .form-header h1 {
      font-size: 22px;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .form-header p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .form-row .form-group {
      flex: 1;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--primary);
    }

    input[type="text"],
    input[type="tel"],
    input[type="email"],
    select,
    textarea {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: #fff;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    textarea {
      resize: vertical;
      min-height: 75px;
    }

    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 20px 0;
    }

    .checkbox-group input {
      margin-top: 3px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .checkbox-group label {
      font-size: 12px;
      font-weight: normal;
      color: var(--text-muted);
      line-height: 1.4;
      cursor: pointer;
    }

    .checkbox-group a {
      color: var(--accent);
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background-color: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .feedback-message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      line-height: 1.4;
    }

    .feedback-message.success {
      display: block;
      background-color: #edf7ed;
      color: #1e4620;
      border: 1px solid #c8e6c9;
    }

    .feedback-message.error {
      display: block;
      background-color: #fdecea;
      color: #611a15;
      border: 1px solid #f5c6cb;
    }

    footer {
      border-top: 1px solid var(--border-color);
      background: var(--card-bg);
      padding: 20px 24px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand">
      <span class="brand-title">LIMPIAPP</span>
      <span class="brand-sub">by Shineconnect</span>
    </a>
    <div class="lang-switcher">
      <select id="selectLang" onchange="cambiarIdioma(this.value)">
        <option value="es" selected>Español</option>
        <option value="ca">Valencià</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="it">Italiano</option>
      </select>
    </div>
  </header>

  <main>
    <div class="form-card">
      <div class="form-header">
        <h1 id="txtTitulo">Solicitud de Servicio de Limpieza</h1>
        <p id="txtSubtitulo">Encuentra al profesional verificado ideal en tu zona en pocos minutos.</p>
      </div>

      <form id="formCliente">
        <input type="hidden" name="perfil_usuario" value="cliente">

        <div class="form-group">
          <label for="inputNombre" id="lblNombre">Nombre Completo *</label>
          <input type="text" name="nombre" id="inputNombre" required placeholder="Ej. Ana Gómez">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="inputTelefono" id="lblTelefono">WhatsApp / Teléfono *</label>
            <input type="tel" name="telefono" id="inputTelefono" required placeholder="600 000 000">
          </div>
          <div class="form-group">
            <label for="inputEmail" id="lblEmail">Correo Electrónico *</label>
            <input type="email" name="email" id="inputEmail" required placeholder="tu@email.com">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="inputPais" id="lblPais">País *</label>
            <input type="text" name="pais" id="inputPais" value="España" required>
          </div>
          <div class="form-group">
            <label for="inputCiudad" id="lblCiudad">Ciudad / Población *</label>
            <input type="text" name="ciudad" id="inputCiudad" required placeholder="Ej. Valencia, Fortaleny...">
          </div>
          <div class="form-group">
            <label for="inputCp" id="lblCp">Código Postal *</label>
            <input type="text" name="cp" id="inputCp" required maxlength="5" placeholder="46001">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="selectServicio" id="lblServicio">Tipo de Servicio *</label>
            <select name="servicio" id="selectServicio">
              <option value="Mantenimiento periódico regular" id="optServRegular" selected>Mantenimiento periódico regular</option>
              <option value="Limpieza a fondo puntual" id="optServFondo">Limpieza a fondo puntual</option>
              <option value="Fin de obra o mudanza" id="optServMudanza">Fin de obra o mudanza</option>
              <option value="Apartamento turístico" id="optServTuristico">Apartamento turístico</option>
              <option value="Oficinas o locales comerciales" id="optServOficina">Oficinas o locales comerciales</option>
            </select>
          </div>
          <div class="form-group">
            <label for="selectFormula" id="lblFormula">Fórmula Elegida *</label>
            <select name="formula" id="selectFormula">
              <option value="Fórmula Estándar de Cliente" id="optFormEstandar">Fórmula Estándar</option>
              <option value="Fórmula Premium de Cliente" id="optFormPremium" selected>Fórmula Premium</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="txtDetalles" id="lblDetalles">Detalles / Notas Adicionales</label>
          <textarea name="detalles" id="txtDetalles" placeholder="Indica metros cuadrados aproximados, habitaciones, periodicidad deseada..."></textarea>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" name="rgpd" id="checkRgpd" required>
          <label for="checkRgpd" id="lblRgpd">
            He leído y acepto los <a href="terminos.html" target="_blank">Términos del Servicio</a> y la <a href="privacidad.html" target="_blank">Política de Privacidad</a> de SHINECONNECT S.L.
          </label>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">Solicitar Profesionales Disponibles</button>

        <div id="feedbackBox" class="feedback-message"></div>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 SHINECONNECT S.L. — LIMPIAPP. Todos los derechos reservados. Contacto: gerencia@limpiapp.app | WhatsApp Atención: +34 711 29 50 17</p>
  </footer>

    let idiomaActual = 'es';

    function cambiarIdioma(lang) {
      idiomaActual = lang;
      const t = traducciones[lang] || traducciones.es;
      
      document.getElementById('txtTitulo').innerText = t.titulo;
      document.getElementById('txtSubtitulo').innerText = t.subtitulo;
      document.getElementById('lblNombre').innerText = t.lblNombre;
      document.getElementById('inputNombre').placeholder = t.placeholderNombre;
      document.getElementById('lblTelefono').innerText = t.lblTelefono;
      document.getElementById('inputTelefono').placeholder = t.placeholderTelefono;
      document.getElementById('lblEmail').innerText = t.lblEmail;
      document.getElementById('inputEmail').placeholder = t.placeholderEmail;
      document.getElementById('lblPais').innerText = t.lblPais;
      document.getElementById('lblCiudad').innerText = t.lblCiudad;
      document.getElementById('inputCiudad').placeholder = t.placeholderCiudad;
      document.getElementById('lblCp').innerText = t.lblCp;
      document.getElementById('inputCp').placeholder = t.placeholderCp;
      document.getElementById('lblServicio').innerText = t.lblServicio;
      document.getElementById('optServRegular').innerText = t.optServRegular;
      document.getElementById('optServFondo').innerText = t.optServFondo;
      document.getElementById('optServMudanza').innerText = t.optServMudanza;
      document.getElementById('optServTuristico').innerText = t.optServTuristico;
      document.getElementById('optServOficina').innerText = t.optServOficina;
      document.getElementById('lblFormula').innerText = t.lblFormula;
      document.getElementById('optFormEstandar').innerText = t.optFormEstandar;
      document.getElementById('optFormPremium').innerText = t.optFormPremium;
      document.getElementById('lblDetalles').innerText = t.lblDetalles;
      document.getElementById('txtDetalles').placeholder = t.placeholderDetalles;
      document.getElementById('lblRgpd').innerHTML = t.lblRgpd;
      document.getElementById('btnSubmit').innerText = t.btnSubmit;
    }

    const form = document.getElementById('formCliente');
    const btnSubmit = document.getElementById('btnSubmit');
    const feedbackBox = document.getElementById('feedbackBox');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const t = traducciones[idiomaActual];

      btnSubmit.disabled = true;
      btnSubmit.innerText = t.enviando;
      feedbackBox.className = 'feedback-message';
      feedbackBox.style.display = 'none';

      const formData = new FormData(form);

      // Endpoint conectado a tu Apps Script implementado
      fetch(form.action || window.location.href, {
        method: 'POST',
        body: formData
      })
      .then(response => response.json().catch(() => ({ result: 'success' })))
      .then(data => {
        feedbackBox.innerText = t.exito;
        feedbackBox.className = 'feedback-message success';
        feedbackBox.style.display = 'block';
        form.reset();
      })
      .catch(error => {
        console.error('Error enviando formulario:', error);
        feedbackBox.innerText = t.error;
        feedbackBox.className = 'feedback-message error';
        feedbackBox.style.display = 'block';
      })
      .finally(() => {
        btnSubmit.disabled = false;
        btnSubmit.innerText = t.btnSubmit;
      });
    });
