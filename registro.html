<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alta Profesional — LIMPIAPP</title>
  <style>
    :root {
      --primary: #059669;
      --primary-hover: #047857;
      --primary-light: #ecfdf5;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --radius: 1rem;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .form-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 520px;
      border-radius: var(--radius);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .header-banner {
      background: linear-gradient(135deg, #064e3b 0%, #065f46 100%);
      color: #ffffff;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    .brand-title {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 0.25rem;
      color: #ffffff;
    }

    .brand-title span {
      color: #34d399;
    }

    .brand-sub {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #a7f3d0;
      font-weight: 600;
      margin-bottom: 1.25rem;
    }

    .promo-badge {
      display: inline-flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 0.4rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      backdrop-filter: blur(4px);
    }

    .benefits-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      padding: 1.25rem 1.5rem;
      background: var(--primary-light);
      border-bottom: 1px solid #d1fae5;
      text-align: center;
    }

    .benefit-item {
      font-size: 0.75rem;
      font-weight: 600;
      color: #065f46;
      line-height: 1.2;
    }

    .benefit-item span {
      display: block;
      font-size: 1.1rem;
      margin-bottom: 0.2rem;
    }

    form {
      padding: 1.75rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
    }

    input[type="text"],
    input[type="tel"],
    input[type="number"],
    select {
      width: 100%;
      padding: 0.75rem 0.85rem;
      border: 1.5px solid var(--border);
      border-radius: 0.5rem;
      font-size: 0.95rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.15s ease;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .legal-box {
      background: #f1f5f9;
      padding: 1rem;
      border-radius: 0.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .checkbox-container {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      cursor: pointer;
    }

    .checkbox-container input {
      margin-top: 0.2rem;
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .checkbox-container span {
      font-size: 0.8rem;
      color: #334155;
    }

      color: var(--primary);
      text-decoration: underline;
