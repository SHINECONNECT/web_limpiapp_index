<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso | LIMPIAPP</title>
  <meta name="description" content="Las cuentas de LIMPIAPP abrirán con la app. Mientras tanto, deja tu solicitud como cliente o profesional de limpieza.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#4f585d">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/inter.css">

  <style>
    :root {
      --color-logo-blue: #7faecb;
      --color-logo-blue-dark: #4a7a99;
      --color-logo-charcoal: #4f585d;
      --color-logo-charcoal-dark: #373e42;
      --color-slate-dark: #24292d;
      --color-slate-medium: #475259;
      --color-slate-muted: #5d6970;
      --color-slate-border: #d4dfe6;
      --color-bg-page: #f8fafc;
      --color-bg-card: #ffffff;
      --radius-sm: 8px;
      --radius-lg: 16px;
      --shadow-card: 0 10px 25px -5px rgba(36, 41, 45, 0.08);
    }
    [hidden] { display: none !important; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    body { background: var(--color-bg-page); color: var(--color-slate-dark); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; }

    .top-bar { background: var(--color-bg-card); border-bottom: 1px solid var(--color-slate-border); padding: 8px 24px; width: 100%; display: flex; justify-content: flex-end; align-items: center; gap: 12px; font-size: 0.85rem; }
    .top-bar label { color: var(--color-slate-muted); font-weight: 600; }
    .lang-select { padding: 5px 12px; border-radius: var(--radius-sm); border: 1px solid var(--color-slate-border); font-size: 0.85rem; background: var(--color-bg-page); color: var(--color-slate-dark); font-weight: 600; cursor: pointer; }

    .main-wrapper { width: 100%; display: flex; justify-content: center; padding: 30px 16px 50px; }
    .container { max-width: 520px; width: 100%; background: var(--color-bg-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); border: 1.5px solid var(--color-slate-border); overflow: hidden; }
    .card-header { padding: 24px 20px 16px; text-align: center; border-bottom: 1px solid var(--color-slate-border); }
    .card-header img { max-width: 260px; width: 80%; height: auto; display: block; margin: 0 auto; mix-blend-mode: multiply; }
    .content-area { padding: 28px 24px 32px; }

    .back-link { display: inline-block; color: var(--color-logo-blue-dark); text-decoration: none; font-weight: 700; font-size: 0.9rem; margin-bottom: 18px; }
    .back-link:hover { text-decoration: underline; }
    h1 { font-size: 1.5rem; font-weight: 800; line-height: 1.3; margin-bottom: 12px; }
    p { color: var(--color-slate-medium); font-size: 0.95rem; margin-bottom: 12px; }

    .actions { display: grid; gap: 12px; margin-top: 22px; }
    .btn { display: block; text-align: center; text-decoration: none; padding: 13px 16px; border-radius: var(--radius-sm); font-weight: 700; font-size: 1rem; border: 2px solid var(--color-logo-charcoal); transition: background .2s; }
    .btn-primary { background: var(--color-logo-charcoal); color: #fff; }
    .btn-primary:hover { background: var(--color-logo-charcoal-dark); }
    .btn-secondary { background: #fff; color: var(--color-logo-charcoal); }
    .btn-secondary:hover { background: #eef5f9; }
    .btn:focus-visible, .lang-select:focus-visible, a:focus-visible { outline: 3px solid var(--color-logo-blue); outline-offset: 2px; }

    footer { background: var(--color-slate-dark); color: #b4bfca; padding: 36px 20px 28px; font-size: 0.9rem; text-align: center; width: 100%; }
    .footer-links { display: flex; justify-content: center; gap: 8px 18px; flex-wrap: wrap; margin: 12px 0 16px; }
    .footer-links a, .footer-links button { color: #e2e8f0; text-decoration: none; font-size: 0.85rem; background: none; border: 0; cursor: pointer; font-family: inherit; padding: 0; }
    .footer-links a:hover, .footer-links button:hover { color: #fff; text-decoration: underline; }
    .footer-desc { font-size: 0.8rem; color: #94a3b8; line-height: 1.5; }

    @media (max-width: 600px) {
      .top-bar { justify-content: center; padding: 8px 14px; }
      .lang-select { font-size: 16px; max-width: 175px; }
      .main-wrapper { padding: 18px 12px 36px; }
      .content-area { padding: 22px 18px 26px; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <label for="langSelect">🌐 Idioma / Language:</label>
    <select class="lang-select" id="langSelect">
      <optgroup label="Lenguas de España">
        <option value="es" selected>Español</option>
        <option value="ca">Valencià / Català</option>
        <option value="gl">Galego</option>
        <option value="eu">Euskara</option>
      </optgroup>
      <optgroup label="Unión Europea">
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="it">Italiano</option>
        <option value="pt">Português</option>
      </optgroup>
    </select>
  </div>

  <div class="main-wrapper">
    <main class="container">
      <div class="card-header">
        <a href="index.html" id="logoLink" aria-label="LIMPIAPP">
          <img src="/logo.png" width="1200" height="353" alt="LIMPIAPP by Shineconnect">
        </a>
      </div>

      <div class="content-area">
        <a href="index.html" class="back-link" id="backLink">← Volver al inicio</a>
        <h1 id="loginTitle">Acceso a tu cuenta: próximamente</h1>
        <p id="loginP1"></p>
        <p id="loginP2"></p>

        <div class="actions">
          <a href="clientes.html" class="btn btn-primary" id="ctaClient"></a>
          <a href="registro.html" class="btn btn-secondary" id="ctaPro"></a>
          <a href="#" class="btn btn-primary" id="ctaOpenApp" hidden></a>
        </div>
      </div>
    </main>
  </div>

  <footer>
    <div class="footer-container">
      <p id="footCopy" style="color:#e2e8f0;font-weight:500;">&copy; 2026 SHINECONNECT S.L. — LIMPIAPP. Todos los derechos reservados.</p>
      <nav class="footer-links" aria-label="Legal">
        <a href="aviso-legal.html" id="footAviso">Aviso Legal</a>
        <a href="terminos.html" id="footTerminos">Términos y Condiciones</a>
        <a href="privacidad.html" id="footPrivacidad">Política de Privacidad</a>
        <a href="cookies.html" id="footCookies">Política de Cookies</a>
        <button type="button" id="footConfigCookies" onclick="abrirConfiguracionCookies()">Configurar Cookies</button>
      </nav>
      <p class="footer-desc">Shineconnect S.L. (B26917807) · c/Mayor, 5, Fortaleny, España · gerencia@limpiapp.app</p>
    </div>
  </footer>

  <script src="waitlist-config.js"></script>
  <script src="waitlist-i18n.js"></script>
  <script>
    (function () {
      var SUPPORTED = ['es', 'ca', 'gl', 'eu', 'en', 'fr', 'de', 'it', 'pt'];
      var FOOT = {
        es: { footAviso: 'Aviso Legal', footTerminos: 'Términos y Condiciones', footPrivacidad: 'Política de Privacidad', footCookies: 'Política de Cookies', footConfigCookies: 'Configurar Cookies' },
        ca: { footAviso: 'Avís Legal', footTerminos: 'Termes i Condicions', footPrivacidad: 'Política de Privacitat', footCookies: 'Política de Galetes', footConfigCookies: 'Configurar Galetes' },
        gl: { footAviso: 'Aviso Legal', footTerminos: 'Termos e Condicións', footPrivacidad: 'Política de Privacidade', footCookies: 'Política de Cookies', footConfigCookies: 'Configurar Cookies' },
        eu: { footAviso: 'Legezko Oharra', footTerminos: 'Baldintzak eta Xedapenak', footPrivacidad: 'Pribatutasun Politika', footCookies: 'Cookie Politika', footConfigCookies: 'Cookieak Konfiguratu' },
        en: { footAviso: 'Legal Notice', footTerminos: 'Terms & Conditions', footPrivacidad: 'Privacy Policy', footCookies: 'Cookie Policy', footConfigCookies: 'Cookie Settings' },
        fr: { footAviso: 'Mentions Légales', footTerminos: 'Conditions Générales', footPrivacidad: 'Politique de Confidentialité', footCookies: 'Gestion des Cookies', footConfigCookies: 'Configurer les Cookies' },
        de: { footAviso: 'Impressum', footTerminos: 'Allgemeine Geschäftsbedingungen', footPrivacidad: 'Datenschutzerklärung', footCookies: 'Cookie-Richtlinie', footConfigCookies: 'Cookies konfigurieren' },
        it: { footAviso: 'Note Legali', footTerminos: 'Termini e Condizioni', footPrivacidad: 'Informativa sulla Privacy', footCookies: 'Cookie Policy', footConfigCookies: 'Configura Cookie' },
        pt: { footAviso: 'Aviso Legal', footTerminos: 'Termos e Condições', footPrivacidad: 'Política de Privacidade', footCookies: 'Política de Cookies', footConfigCookies: 'Configurar Cookies' }
      };

      var params = new URLSearchParams(window.location.search);
      var app = (window.LIMPIAPP_CONFIG && window.LIMPIAPP_CONFIG.app) || {};

      function getLang() {
        var l = params.get('lang');
        if (!l) { try { l = localStorage.getItem('limpiapp_lang') || localStorage.getItem('lang'); } catch (e) {} }
        return SUPPORTED.indexOf(l) >= 0 ? l : 'es';
      }

      // Cookie que usan las páginas legales para traducirse con Google Translate (acción elegida por la persona)
      function syncTranslateCookie(lang) {
        var host = location.hostname;
        var domain = (host.indexOf('.') !== -1 && !/^[0-9.]+$/.test(host)) ? '.' + host.replace(/^www\./, '') : '';
        var expire = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
        document.cookie = expire;
        if (domain) document.cookie = expire + ' domain=' + domain + ';';
        if (lang !== 'es') {
          document.cookie = 'googtrans=/es/' + lang + '; path=/;';
          if (domain) document.cookie = 'googtrans=/es/' + lang + '; path=/; domain=' + domain + ';';
        }
      }

      function setText(id, text) { var el = document.getElementById(id); if (el) el.textContent = text; }

      function apply(lang) {
        var t = function (k) { return window.limpiappWlText(lang, k); };
        try { localStorage.setItem('limpiapp_lang', lang); localStorage.setItem('lang', lang); } catch (e) {}
        syncTranslateCookie(lang);
        document.documentElement.lang = lang;
        document.title = t('login_page_title');
        document.getElementById('langSelect').value = lang;

        setText('loginTitle', t('login_title'));
        setText('loginP1', t('login_p1'));
        setText('loginP2', t('login_p2'));
        setText('ctaClient', t('login_cta_client'));
        setText('ctaPro', t('login_cta_pro'));
        setText('ctaOpenApp', t('login_open_app'));
        setText('backLink', t('login_back'));

        var f = FOOT[lang];
        Object.keys(f).forEach(function (id) { setText(id, f[id]); });

        var q = '?lang=' + encodeURIComponent(lang);
        [['logoLink', 'index.html'], ['backLink', 'index.html'], ['ctaClient', 'clientes.html'], ['ctaPro', 'registro.html'],
         ['footAviso', 'aviso-legal.html'], ['footTerminos', 'terminos.html'], ['footPrivacidad', 'privacidad.html'], ['footCookies', 'cookies.html']
        ].forEach(function (pair) { var el = document.getElementById(pair[0]); if (el) el.setAttribute('href', pair[1] + q); });

        try {
          var u = new URL(location.href); u.searchParams.set('lang', lang);
          history.replaceState({}, '', u.toString());
        } catch (e) {}
      }

      // Enlaces antiguos tipo login.html?mode=register&role=profesional → directos a su formulario
      var role = params.get('role');
      if (params.get('mode') === 'register') {
        location.replace((role === 'profesional' ? 'registro.html' : 'clientes.html') + '?lang=' + encodeURIComponent(getLang()));
        return;
      }

      // Cuando la app esté publicada (waitlist-config.js → app.openUrl) aparece el botón
      if (app.openUrl) {
        var open = document.getElementById('ctaOpenApp');
        open.href = app.openUrl;
        open.hidden = false;
      }

      document.getElementById('langSelect').addEventListener('change', function () { apply(this.value); });
      apply(getLang());
    })();
  </script>
  <script src="cookies-consent.js"></script>
</body>
</html>
