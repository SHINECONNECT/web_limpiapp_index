<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Sin conexión | LIMPIAPP</title>
  <meta name="theme-color" content="#4f585d">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #24292d; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
    main { max-width: 440px; }
    img { width: 220px; height: auto; margin-bottom: 24px; }
    h1 { font-size: 1.4rem; margin-bottom: 10px; }
    p { color: #475259; line-height: 1.6; margin-bottom: 8px; }
    button { margin-top: 18px; background: #4f585d; color: #fff; border: 0; border-radius: 8px; padding: 12px 22px; font-size: 1rem; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 3px solid #7faecb; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="/logo-600.png" width="600" height="177" alt="LIMPIAPP">
    <h1>No hay conexión a internet</h1>
    <p>Comprueba tu conexión y vuelve a intentarlo.</p>
    <p lang="en">You are offline. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Reintentar / Retry</button>
  </main>
</body>
</html>
