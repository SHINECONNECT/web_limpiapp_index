    :root {

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }

    /* Barra Superior Multilingüe */
    .top-bar {

      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
    }

    .goog-te-gadget { font-size: 0 !important; }

      cursor: pointer;
    }

    /* Navegación Principal */
    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;

    .logo-container img {
      max-width: 220px;
      height: auto;
      display: block;
    }
    .nav-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .btn-nav-client {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 8px 16px;
      border: 1px solid var(--primary);
      border-radius: 8px;
      transition: all 0.2s;
    }
    .btn-nav-client:hover { background: #e0f2fe; }
    .btn-nav-pro {
      background: var(--secondary);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 8px 18px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .btn-nav-pro:hover { background: var(--secondary-dark); }

    /* Sección Hero Principal */
    .hero {
      max-width: 1000px;
      margin: 0 auto;
      padding: 60px 20px 40px;
      text-align: center;
    }
    .badge-hero {
      display: inline-block;

      font-weight: 700;
      margin-bottom: 20px;
    }
    .hero h1 {
      font-size: 2.8rem;
      font-weight: 800;
      line-height: 1.2;
      color: #0f172a;
      margin-bottom: 20px;
    }
    .hero h1 span { color: var(--primary); }
    .hero p {
      font-size: 1.2rem;
      color: var(--text-muted);
      max-width: 760px;
      margin: 0 auto 36px;
    }

    /* Tarjetas de Selección B2B / B2C */
    .dual-cta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      max-width: 900px;
      margin: 0 auto 50px;
      text-align: left;
    }
    .cta-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .cta-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }
    .cta-card.client { border-top: 5px solid var(--primary); }
    .cta-card.pro { border-top: 5px solid var(--secondary); }

      margin-bottom: 10px;
    }
    .cta-card.client .card-tag { color: var(--primary); }
    .cta-card.pro .card-tag { color: var(--secondary); }
    .cta-card h2 { font-size: 1.5rem; margin-bottom: 12px; color: #0f172a; }
    .cta-card p { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 24px; line-height: 1.5; }
    .btn-action {

      transition: background 0.2s;
    }
    .btn-action.client { background: var(--primary); color: #ffffff; }
    .btn-action.client:hover { background: var(--primary-dark); }
    .btn-action.pro { background: var(--secondary); color: #ffffff; }
    .btn-action.pro:hover { background: var(--secondary-dark); }
