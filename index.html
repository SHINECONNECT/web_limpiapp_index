<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIMPIAPP | Conectamos Servicios de Limpieza por Código Postal</title>
  
  <!-- Integración Técnica App Móvil (Figma / Serxus) -->
  <meta name="apple-itunes-app" content="app-id=limpiapp">
  <link rel="alternate" href="limpiapp://home">
  <meta name="theme-color" content="#006972">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* DESIGN TOKENS CORPORATIVOS LIMPIAPP */
    :root {
      --color-primary: #006972;
      --color-primary-hover: #004f56;
      --color-primary-light: #e0f2fe;
      
      --color-secondary: #059669;
      --color-secondary-hover: #047857;
      --color-secondary-light: #ecfdf5;
      
      --color-slate-dark: #0f172a;
      --color-slate-medium: #334155;
      --color-slate-muted: #64748b;
      --color-slate-border: #cbd5e1;
      
      --color-bg-page: #f8fafc;
      --color-bg-card: #ffffff;
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-card: 0 10px 25px -5px rgba(15, 23, 42, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--color-bg-page); color: var(--color-slate-dark); line-height: 1.6; }

    /* Barra Superior Multilingüe */
    .top-bar {
      background-color: var(--color-bg-card);
      border-bottom: 1px solid #e2e8f0;
      padding: 8px 24px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
    }
    .lang-select {
      padding: 5px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-slate-border);
      font-size: 0.82rem;
      background: var(--color-bg-page);
      color: var(--color-slate-medium);
      font-weight: 600;
      cursor: pointer;
    }

    /* Cabecera Principal */
    header {
      background: var(--color-bg-card);
      border-bottom: 1px solid #e2e8f0;
      padding: 16px 24px;
      width: 100%;
    }
    .header-inner {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo-container img {
      max-width: 230px;
      height: auto;
      display: block;
    }
    .nav-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .btn-nav-client {
      color: var(--color-primary);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 9px 18px;
      border: 1.5px solid var(--color-primary);
      border-radius: var(--radius-sm);
      transition: all 0.2s;
    }
    .btn-nav-client:hover { background: var(--color-primary-light); }
    .btn-nav-pro {
      background: var(--color-secondary);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      transition: background 0.2s;
    }
    .btn-nav-pro:hover { background: var(--color-secondary-hover); }

    /* Hero Principal con Buscador de CP */
    .hero {
      max-width: 960px;
      margin: 0 auto;
      padding: 50px 20px 30px;
      text-align: center;
    }
    .badge-hero {
      display: inline-block;
      background: var(--color-secondary-light);
      color: var(--color-secondary-hover);
      border: 1px solid #a7f3d0;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .hero h1 {
      font-size: 2.7rem;
      font-weight: 800;
      line-height: 1.25;
      color: var(--color-slate-dark);
      margin-bottom: 18px;
    }
    .hero h1 span { color: var(--color-primary); }
    .hero p {
      font-size: 1.15rem;
      color: var(--color-slate-muted);
      max-width: 760px;
      margin: 0 auto 30px;
    }

    /* Buscador por Código Postal */
    .search-box-cp {
      background: #ffffff;
      max-width: 540px;
      margin: 0 auto 40px;
      padding: 8px;
      border-radius: var(--radius-md);
      border: 2px solid var(--color-primary);
      box-shadow: 0 10px 20px -5px rgba(0, 105, 114, 0.15);
      display: flex;
      gap: 8px;
    }
    .search-box-cp input {
      flex: 1;
      border: none;
      padding: 12px 16px;
      font-size: 1rem;
      outline: none;
      color: var(--color-slate-dark);
    }
    .search-box-cp button {
      background: var(--color-primary);
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .search-box-cp button:hover { background: var(--color-primary-hover); }

    /* Tarjetas de Selección B2B y B2C */
    .dual-cta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      max-width: 900px;
      margin: 0 auto 60px;
      text-align: left;
    }
    .cta-card {
      background: var(--color-bg-card);
      border: 1.5px solid #e2e8f0;
      border-radius: var(--radius-lg);
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-card);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .cta-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 30px rgba(15, 23, 42, 0.08);
    }
    .cta-card.client { border-top: 5px solid var(--color-primary); }
    .cta-card.pro { border-top: 5px solid var(--color-secondary); }
    .card-tag {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }
